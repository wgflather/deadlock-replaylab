[package]
name = "deadlock-demo-parser"
version = "0.1.0"
edition = "2021"
description = "Parses a Deadlock .dem replay into scoreboard snapshots, in the browser."

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned: haste is not published to crates.io and its author warns the API is unstable.
haste = { git = "https://github.com/blukai/haste.git", rev = "e5491c37fb70ea7cc762423406a450dd956c8050", features = ["deadlock"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
